name: UI proof e66260b

on:
  push:
    branches:
      - evidence/ui-proof-e66260b
  workflow_dispatch:

permissions:
  contents: write

env:
  TARGET_SHA: e66260b0cf7573114793aced0384862c92faf191
  TARGET_BRANCH: manus/content-machine-closeout

jobs:
  capture-ui:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: content_machine_test
          POSTGRES_PASSWORD: content_machine_test
          POSTGRES_DB: content_machine_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U content_machine_test -d content_machine_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      NODE_ENV: test
      ALLOW_TEST_DATABASE_RESET: "true"
      DATABASE_URL: postgresql://content_machine_test:content_machine_test@localhost:5432/content_machine_test
      MIGRATIONS_DIR: ${{ github.workspace }}/lib/db/drizzle
      SESSION_SECRET: ui-proof-test-session-secret-not-production
      ADMIN_PASSWORD: ui-proof-test-password-not-production
      TEST_ADMIN_PASSWORD: ui-proof-test-password-not-production
      PORT: "8080"
      API_PORT: "8080"
    steps:
      - name: Checkout exact product commit
        uses: actions/checkout@v4
        with:
          ref: ${{ env.TARGET_SHA }}
          fetch-depth: 0

      - uses: pnpm/action-setup@v4
        with:
          version: 11.16.0

      - uses: actions/setup-node@v4
        with:
          node-version: 24.15.0
          cache: pnpm

      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile

      - name: Prepare isolated integration database
        run: pnpm --filter @workspace/api-server test:db:prepare

      - name: Build API
        run: pnpm --filter @workspace/api-server build

      - name: Start isolated API
        run: |
          pnpm --filter @workspace/api-server start > "$RUNNER_TEMP/content-machine-api.log" 2>&1 &
          echo $! > "$RUNNER_TEMP/content-machine-api.pid"
          for attempt in {1..45}; do
            if curl --fail --silent http://localhost:8080/api/healthz >/dev/null; then exit 0; fi
            sleep 1
          done
          cat "$RUNNER_TEMP/content-machine-api.log"
          exit 1

      - name: Start Content OS frontend
        run: |
          pnpm --filter @workspace/content-os dev > "$RUNNER_TEMP/content-os-ui.log" 2>&1 &
          echo $! > "$RUNNER_TEMP/content-os-ui.pid"
          for attempt in {1..45}; do
            if curl --fail --silent http://localhost:5173/ >/dev/null; then exit 0; fi
            sleep 1
          done
          cat "$RUNNER_TEMP/content-os-ui.log"
          exit 1

      - name: Install Playwright Chromium
        run: pnpm dlx playwright@1.55.0 install --with-deps chromium

      - name: Capture real authenticated UI
        run: |
          mkdir -p docs/evidence/ui
          cat > "$RUNNER_TEMP/capture-ui.mjs" <<'EOF'
          import { chromium } from 'playwright';
          import fs from 'node:fs';
          import path from 'node:path';

          const out = path.resolve('docs/evidence/ui');
          const password = process.env.TEST_ADMIN_PASSWORD;
          const base = 'http://127.0.0.1:5173';
          const targetSha = process.env.TARGET_SHA;
          const targetBranch = process.env.TARGET_BRANCH;
          const rows = [];
          const notes = [];

          function add(file, route, viewport, auth, proves) {
            rows.push({ file, route, viewport, auth, proves });
          }

          async function shot(page, file, route, viewport, auth, proves, fullPage = true) {
            await page.screenshot({ path: path.join(out, file), fullPage });
            add(file, route, `${viewport.width}x${viewport.height}`, auth, proves);
          }

          async function clickText(page, text, opts = {}) {
            const el = page.getByText(text, { exact: opts.exact ?? true }).first();
            if (await el.count()) {
              await el.click();
              return true;
            }
            return false;
          }

          async function captureCore(viewport, suffix) {
            const browser = await chromium.launch({ headless: true });
            const context = await browser.newContext({ viewport, deviceScaleFactor: 1 });
            const page = await context.newPage();
            page.setDefaultTimeout(15000);

            await page.goto(base, { waitUntil: 'networkidle' });
            if (suffix === 'desktop') {
              await shot(page, '01-login-desktop.png', '/', viewport, 'unauthenticated', 'Actual Content OS login screen before authentication.');
            }

            const passwordInput = page.locator('input[type="password"]').first();
            await passwordInput.fill(password);
            const signIn = page.getByRole('button', { name: /sign in/i }).first();
            await signIn.click();
            await page.waitForTimeout(1000);

            const unlock = await context.request.post('http://127.0.0.1:8080/api/auth/admin-unlock', { data: { password } });
            if (!unlock.ok()) notes.push(`Admin unlock returned ${unlock.status()}`);
            const seed = await context.request.post('http://127.0.0.1:8080/api/seed');
            if (!seed.ok()) notes.push(`Seed returned ${seed.status()}`);

            await page.goto(`${base}/dashboard`, { waitUntil: 'networkidle' });
            await shot(page, suffix === 'desktop' ? '02-dashboard-desktop.png' : suffix === 'mobile' ? '20-dashboard-mobile.png' : `dashboard-${suffix}.png`, '/dashboard', viewport, 'authenticated test session', 'Authenticated dashboard and primary application shell/navigation.');

            await page.goto(`${base}/create`, { waitUntil: 'networkidle' });
            await shot(page, suffix === 'desktop' ? '03-create-content-desktop.png' : suffix === 'mobile' ? '21-create-mobile.png' : `create-${suffix}.png`, '/create', viewport, 'authenticated test session', 'New Content creation screen with topic input, brand selection, and supported content types.');

            if (suffix === 'desktop') {
              const adv = page.getByRole('button', { name: /advanced/i }).first();
              if (await adv.count()) {
                await adv.click();
                await page.waitForTimeout(300);
                await shot(page, '04-advanced-creation-options.png', '/create', viewport, 'authenticated test session', 'Advanced content-creation options expanded in the real application.');
              }
            }

            const topic = page.locator('textarea').first();
            await topic.fill('UI Proof Demo — Building a measurable content engine for a growing service business');

            const generate = page.getByRole('button', { name: /generate content/i }).first();
            if (!(await generate.count())) throw new Error('Generate Content button not found');
            await generate.click();

            if (suffix === 'desktop') {
              await page.waitForTimeout(450);
              await shot(page, '05-generation-loading-state.png', '/create', viewport, 'authenticated test session', 'Actual in-product generation/loading state after submitting New Content.');
            }

            await page.waitForURL(/\/projects\//, { timeout: 90000 });
            await page.waitForTimeout(5000);
            const projectUrl = page.url();

            await shot(page, suffix === 'desktop' ? '06-project-detail-desktop.png' : suffix === 'mobile' ? '22-project-detail-mobile.png' : `project-detail-${suffix}.png`, projectUrl.replace(base,''), viewport, 'authenticated test session', 'Generated project detail screen, workflow navigation, and generated project state.');

            const editorTab = page.getByRole('button', { name: 'Editor', exact: true }).first();
            if (await editorTab.count()) {
              await editorTab.click();
              await page.waitForTimeout(1500);
            } else {
              await clickText(page, 'Editor');
              await page.waitForTimeout(1500);
            }

            await shot(page, suffix === 'desktop' ? '07-rich-editor-desktop.png' : suffix === 'mobile' ? '23-rich-editor-mobile.png' : `rich-editor-${suffix}.png`, projectUrl.replace(base,'') + '#editor', viewport, 'authenticated test session', 'Rich editor with generated content, section navigation, formatting controls, and editing actions.');

            if (suffix === 'desktop') {
              const videoButton = page.getByRole('button', { name: /video/i }).first();
              if (await videoButton.count()) {
                await videoButton.click();
                await page.waitForTimeout(300);
                await shot(page, '08-video-insertion-dialog.png', projectUrl.replace(base,'') + '#editor', viewport, 'authenticated test session', 'Video insertion dialog from the real rich editor.');
                const dialog = page.getByRole('dialog').last();
                const input = dialog.locator('input').first();
                if (await input.count()) {
                  await input.fill('https://www.youtube.com/watch?v=dQw4w9WgXcQ');
                  const insert = dialog.getByRole('button', { name: /insert|add/i }).last();
                  if (await insert.count()) {
                    await insert.click();
                    await page.waitForTimeout(1200);
                    await shot(page, '09-video-rendered-editor.png', projectUrl.replace(base,'') + '#editor', viewport, 'authenticated test session', 'Valid YouTube embed rendered inside the persisted editor content.');
                  }
                }
              } else notes.push('Video button was not located for focused dialog capture.');

              const imageButton = page.getByRole('button', { name: /image/i }).first();
              if (await imageButton.count()) {
                await imageButton.click();
                await page.waitForTimeout(300);
                await shot(page, '10-image-insertion-workflow.png', projectUrl.replace(base,'') + '#editor', viewport, 'authenticated test session', 'Image insertion workflow/dialog available from the real editor.');
                await page.keyboard.press('Escape');
              } else notes.push('Image button was not located for focused dialog capture.');

              const qualityTab = page.getByRole('button', { name: 'Quality', exact: true }).first();
              if (await qualityTab.count()) await qualityTab.click(); else await clickText(page, 'Quality');
              await page.waitForTimeout(800);
              const runEval = page.getByRole('button', { name: /run|evaluate|review/i }).first();
              if (await runEval.count()) {
                try { await runEval.click(); await page.waitForTimeout(2500); } catch {}
              }
              await shot(page, '11-quality-review.png', projectUrl.replace(base,'') + '#quality', viewport, 'authenticated test session', 'Quality review/evaluation workflow and current evaluation state.');

              const repurposeTab = page.getByRole('button', { name: 'Repurpose', exact: true }).first();
              if (await repurposeTab.count()) {
                await repurposeTab.click();
                await page.waitForTimeout(700);
                await shot(page, '12-repurpose-workflow.png', projectUrl.replace(base,'') + '#repurpose', viewport, 'authenticated test session', 'Repurpose workflow exposed in the authenticated product.');
              }

              const exportTab = page.getByRole('button', { name: 'Export', exact: true }).first();
              if (await exportTab.count()) await exportTab.click(); else await clickText(page, 'Export');
              await page.waitForTimeout(700);
              await shot(page, '13-export-formats.png', projectUrl.replace(base,'') + '#export', viewport, 'authenticated test session', 'Export screen with available output formats.');

              const markdown = page.getByText('Markdown', { exact: true }).first();
              if (await markdown.count()) {
                try { await markdown.click(); } catch {}
              }
              const exportButton = page.getByRole('button', { name: /export|generate/i }).last();
              if (await exportButton.count()) {
                try { await exportButton.click(); } catch {}
                for (let i=0;i<20;i++) {
                  if (await page.getByText(/completed|validation checks passed|download/i).count()) break;
                  await page.waitForTimeout(1000);
                }
              }
              await shot(page, '14-export-complete.png', projectUrl.replace(base,'') + '#export', viewport, 'authenticated test session', 'Completed export state and download/completion feedback when available.');

              await page.goto(`${base}/settings`, { waitUntil: 'networkidle' });
              await shot(page, '15-settings-desktop.png', '/settings', viewport, 'authenticated test session', 'Authenticated settings screen.');

              await page.goto(`${base}/projects`, { waitUntil: 'networkidle' });
              await shot(page, '16-projects-list-state.png', '/projects', viewport, 'authenticated test session', 'Projects list / important collection state with deterministic test project visible.');
            }

            await browser.close();
            return projectUrl;
          }

          const projectUrl = await captureCore({ width: 1440, height: 900 }, 'desktop');
          await captureCore({ width: 1280, height: 800 }, 'laptop');
          await captureCore({ width: 768, height: 1024 }, 'tablet');
          await captureCore({ width: 390, height: 844 }, 'mobile');

          const manifest = [
            '# Content OS UI Evidence',
            '',
            `Application source branch: \`${targetBranch}\``,
            `Exact application Git SHA: \`${targetSha}\``,
            'Environment: GitHub Actions isolated local/test environment with disposable PostgreSQL and isolated test password.',
            'Authentication: real application login endpoint/session; no production credentials and no security weakening.',
            'Data: seeded deterministic test/demo data only; no customer data.',
            '',
            '| Screenshot | Screen / route | Viewport | Authentication | What it proves |',
            '|---|---|---:|---|---|',
            ...rows.map(r => `| \`${r.file}\` | \`${r.route}\` | ${r.viewport} | ${r.auth} | ${r.proves} |`),
            '',
            '## Capture notes',
            ...(notes.length ? notes.map(n => `- ${n}`) : ['- No capture warnings recorded.']),
            '',
            'All PNGs were captured from the browser-rendered Content OS application running from the exact source commit above. No mockup HTML or concept screens were used.'
          ].join('\n');
          fs.writeFileSync(path.join(out, 'README.md'), manifest);
          EOF
          node "$RUNNER_TEMP/capture-ui.mjs"

      - name: Upload UI evidence artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: content-os-ui-proof-e66260b
          path: docs/evidence/ui/
          if-no-files-found: error
          retention-days: 30

      - name: Commit evidence to evidence branch
        if: success()
        run: |
          cp -R docs/evidence/ui "$RUNNER_TEMP/ui-evidence"
          git fetch origin evidence/ui-proof-e66260b
          git switch evidence/ui-proof-e66260b
          mkdir -p docs/evidence
          rm -rf docs/evidence/ui
          cp -R "$RUNNER_TEMP/ui-evidence" docs/evidence/ui
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/evidence/ui
          if git diff --cached --quiet; then
            echo "No evidence changes to commit"
          else
            git commit -m "docs: add Content OS UI proof for e66260b"
            git push origin evidence/ui-proof-e66260b
          fi

      - name: Stop local services
        if: always()
        run: |
          [[ -f "$RUNNER_TEMP/content-os-ui.pid" ]] && kill "$(cat "$RUNNER_TEMP/content-os-ui.pid")" || true
          [[ -f "$RUNNER_TEMP/content-machine-api.pid" ]] && kill "$(cat "$RUNNER_TEMP/content-machine-api.pid")" || true
