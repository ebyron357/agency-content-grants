            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/PerformanceSnapshot"

  /performance/ingest:
    post:
      operationId: triggerPerformanceIngest
      tags: [performance]
      summary: Manually trigger metrics ingestion now (bypasses the background scheduler's throttle), scoped to the caller's own brand(s)
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PerformanceIngestInput"
      responses:
        "200":
          description: Ingestion result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PerformanceIngestResult"

  /performance/recommendations:
    get:
      operationId: listPerformanceRecommendations
      tags: [performance]
      summary: Recompute (from real ingested data) and list evidence-backed recommendations
      parameters:
        - name: brandId
          in: query
          required: false
          schema:
            type: string
      responses:
        "200":
          description: Recommendations, pending first
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/PerformanceRecommendation"

  /performance/recommendations/{id}:
    patch:
      operationId: updatePerformanceRecommendation
      tags: [performance]
      summary: Accept, dismiss, or reset a recommendation — the acceptance-tracking mechanism
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PerformanceRecommendationUpdate"
      responses:
        "200":
          description: Updated recommendation
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PerformanceRecommendation"

