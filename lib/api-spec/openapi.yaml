    get:
      operationId: listPublicationAttempts
      tags: [publishing]
      summary: List the visible attempt history for a scheduled publication
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Attempt history, unsorted-safe (client should sort by attemptNumber)
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/PublicationAttempt"

  /scheduled-publications/{id}/cancel:
    patch:
      operationId: cancelScheduledPublication
      tags: [publishing]
      summary: >-
        Cancel a scheduled publication. A "pending" (never submitted) row is
        cancelled purely in our database. A "queued" (already submitted to the
        provider, not yet confirmed) row triggers a real provider-side
        cancellation, not just a local status flip. If a provider call is in
        flight right now, the cancel is recorded as best-effort and honored by
        that call once it finishes.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Cancelled publication
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ScheduledPublication"
        "202":
          description: >-
            Cancellation could not be confirmed immediately (a provider call
            is in flight, or the provider could not cancel it right now) —
            it will be honored if still possible once that finishes.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CancelPendingResponse"
        "409":
          description: >-
            The provider had already published this post before the
            cancellation could take effect — it is published, not cancelled.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CancelPendingResponse"

  /scheduled-publications/{id}/reschedule:
    patch:
      operationId: rescheduleScheduledPublication
      tags: [publishing]
      summary: Move a pending scheduled publication to a new time
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RescheduleInput"
      responses:
        "200":
          description: Rescheduled publication
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ScheduledPublication"

