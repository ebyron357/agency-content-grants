        worst:
          type: array
          items:
            $ref: "#/components/schemas/PerformanceDimensionAggregate"
        excludedSimulatedPublications:
          type: number
          description: >-
            Count of published items excluded from these rankings because
            their metrics came from the local demo/simulated provider, not a
            real connected platform. Rankings are only ever computed from
            real ingested data; a non-zero count here means simulated data
            exists but was correctly left out of "best/worst" evidence.

