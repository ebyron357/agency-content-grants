openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: Multi-Brand AI Content Operating System API
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
  - name: brands
  - name: projects
  - name: research
  - name: sources
  - name: claims
  - name: outlines
  - name: documents
  - name: quality
  - name: repurposing
  - name: exports
  - name: providers
  - name: blueprints
  - name: dependencies
  - name: dashboard
  - name: storage

paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"

  # ─── Dashboard ───────────────────────────────────────────────────────────────
  /dashboard/stats:
    get:
      operationId: getDashboardStats
      tags: [dashboard]
      summary: Get dashboard overview statistics
      responses:
        "200":
          description: Dashboard stats
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DashboardStats"

  /dashboard/activity:
    get:
      operationId: getRecentActivity
      tags: [dashboard]
      summary: Get recent activity feed
      responses:
        "200":
          description: Recent activity items
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ActivityItem"

  # ─── Brands ──────────────────────────────────────────────────────────────────
  /brands:
    get:
      operationId: listBrands
      tags: [brands]
      summary: List all brands
      responses:
        "200":
          description: List of brands
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Brand"
    post:
      operationId: createBrand
      tags: [brands]
      summary: Create a new brand
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BrandInput"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Brand"

  /brands/{id}:
    get:
      operationId: getBrand
      tags: [brands]
      summary: Get a brand by ID
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Brand
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Brand"
        "404":
          description: Not found
    patch:
      operationId: updateBrand
      tags: [brands]
      summary: Update a brand
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BrandUpdate"
      responses:
        "200":
          description: Updated brand
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Brand"
    delete:
      operationId: deleteBrand
      tags: [brands]
      summary: Delete a brand
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "204":
          description: Deleted

  /brands/{id}/audience-profiles:
    get:
      operationId: listAudienceProfiles
      tags: [brands]
      summary: List audience profiles for a brand
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Audience profiles
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/AudienceProfile"
    post:
      operationId: createAudienceProfile
      tags: [brands]
      summary: Add an audience profile to a brand
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AudienceProfileInput"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AudienceProfile"

  /audience-profiles/{id}:
    patch:
      operationId: updateAudienceProfile
      tags: [brands]
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AudienceProfileUpdate"
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AudienceProfile"
    delete:
      operationId: deleteAudienceProfile
      tags: [brands]
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "204":
          description: Deleted

  /brands/{id}/brand-facts:
    get:
      operationId: listBrandFacts
      tags: [brands]
      summary: List approved facts for a brand
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Brand facts
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/BrandFact"
    post:
      operationId: createBrandFact
      tags: [brands]
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BrandFactInput"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BrandFact"

  /brand-facts/{id}:
    patch:
      operationId: updateBrandFact
      tags: [brands]
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BrandFactUpdate"
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BrandFact"
    delete:
      operationId: deleteBrandFact
      tags: [brands]
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "204":
          description: Deleted

  # ─── Projects ────────────────────────────────────────────────────────────────
  /projects:
    get:
      operationId: listProjects
      tags: [projects]
      summary: List all content projects
      parameters:
        - name: brandId
          in: query
          schema:
            type: string
        - name: status
          in: query
          schema:
            type: string
      responses:
        "200":
          description: List of projects
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Project"
    post:
      operationId: createProject
      tags: [projects]
      summary: Create a new content project
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ProjectInput"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Project"

  /projects/{id}:
    get:
      operationId: getProject
      tags: [projects]
      summary: Get project details
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Project
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Project"
        "404":
          description: Not found
    patch:
      operationId: updateProject
      tags: [projects]
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ProjectUpdate"
      responses:
        "200":
          description: Updated project
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Project"
    delete:
      operationId: deleteProject
      tags: [projects]
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "204":
          description: Deleted

  /projects/{id}/workflow-status:
    get:
      operationId: getProjectWorkflowStatus
      tags: [projects]
      summary: Get the current workflow stage and progress for a project
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Workflow status
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WorkflowStatus"

  # ─── Research ─────────────────────────────────────────────────────────────────
  /projects/{id}/research-plan:
    get:
      operationId: getResearchPlan
      tags: [research]
      summary: Get the research plan for a project
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Research plan
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ResearchPlan"
        "404":
          description: Not found
    post:
      operationId: generateResearchPlan
      tags: [research]
      summary: Generate a research plan for a project (AI)
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ResearchPlanGenerate"
      responses:
        "200":
          description: Research plan generated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ResearchPlan"

  /research-plans/{id}:
    patch:
      operationId: updateResearchPlan
      tags: [research]
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ResearchPlanUpdate"
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ResearchPlan"

  /research-plans/{id}/approve:
    post:
      operationId: approveResearchPlan
      tags: [research]
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Approved research plan
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ResearchPlan"

  # ─── Sources ──────────────────────────────────────────────────────────────────
  /projects/{id}/sources:
    get:
      operationId: listSources
      tags: [sources]
      summary: List sources for a project
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Sources
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Source"
    post:
      operationId: createSource
      tags: [sources]
      summary: Add a source to a project
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SourceInput"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Source"

  /sources/{id}:
    get:
      operationId: getSource
      tags: [sources]
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Source
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Source"
    patch:
      operationId: updateSource
      tags: [sources]
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SourceUpdate"
      responses:
        "200":
          description: Updated source
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Source"
    delete:
      operationId: deleteSource
      tags: [sources]
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "204":
          description: Deleted

  /sources/{id}/approve:
    post:
      operationId: approveSource
      tags: [sources]
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Approved
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Source"

  /sources/{id}/reject:
    post:
      operationId: rejectSource
      tags: [sources]
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RejectNote"
      responses:
        "200":
          description: Rejected
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Source"

  /sources/{id}/fetch:
    post:
      operationId: fetchSourceContent
      tags: [sources]
      summary: Re-fetch and extract content from a URL source
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Updated source with extracted content
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Source"

  /projects/{id}/sources/upload-pdf:
    post:
      operationId: uploadPdfSource
      tags: [sources]
      summary: Upload a PDF file as a source for a project
      description: |
        Accepts a multipart/form-data upload containing a PDF file and optional
        metadata. Extracts text from the PDF and stores the file in object
        storage. Returns the created source record with extracted text.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              $ref: "#/components/schemas/PdfSourceUpload"
      responses:
        "201":
          description: Source created with extracted PDF text
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Source"
        "400":
          description: Missing file or invalid input
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "500":
          description: Upload or extraction failed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"

  # ─── Storage ──────────────────────────────────────────────────────────────────
  /storage/uploads/request-url:
    post:
      tags: [storage]
      operationId: requestUploadUrl
      summary: Request a presigned URL for file upload
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UploadUrlRequest"
      responses:
        "200":
          description: Presigned upload URL generated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UploadUrlResponse"
        "400":
          description: Missing or invalid required fields
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "500":
          description: Failed to generate upload URL
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"

  /storage/public-objects/{filePath}:
    get:
      tags: [storage]
      operationId: getPublicObject
      summary: Serve a public asset from object storage
      parameters:
        - name: filePath
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Object content
          content:
            "*/*":
              schema:
                type: string
                format: binary
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"

  # ─── Claims ───────────────────────────────────────────────────────────────────
  /projects/{id}/claims:
    get:
      operationId: listClaims
      tags: [claims]
      summary: List claims for a project
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Claims
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Claim"
    post:
      operationId: createClaim
      tags: [claims]
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ClaimInput"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Claim"

  /claims/{id}:
    patch:
      operationId: updateClaim
      tags: [claims]
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ClaimUpdate"
      responses:
        "200":
          description: Updated claim
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Claim"
    delete:
      operationId: deleteClaim
      tags: [claims]
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "204":
          description: Deleted

  /claims/{id}/verify:
    post:
      operationId: verifyClaim
      tags: [claims]
      summary: AI-verify a factual claim against its sources
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Claim with updated verification status
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Claim"

  # ─── Outlines ─────────────────────────────────────────────────────────────────
  /projects/{id}/outline:
    get:
      operationId: getOutline
      tags: [outlines]
      summary: Get the outline for a project
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Outline
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Outline"
        "404":
          description: Not found
    post:
      operationId: generateOutline
      tags: [outlines]
      summary: Generate an outline for a project (AI)
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/OutlineGenerate"
      responses:
        "200":
          description: Generated outline
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Outline"

  /outlines/{id}/approve:
    post:
      operationId: approveOutline
      tags: [outlines]
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Approved outline
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Outline"

  /outline-sections/{id}:
    patch:
      operationId: updateOutlineSection
      tags: [outlines]
      summary: Update an outline section
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/OutlineSectionUpdate"
      responses:
        "200":
          description: Updated outline section
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OutlineSection"
    delete:
      operationId: deleteOutlineSection
      tags: [outlines]
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "204":
          description: Deleted

  /outlines/{id}/sections:
    post:
      operationId: addOutlineSection
      tags: [outlines]
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/OutlineSectionInput"
      responses:
        "201":
          description: Created section
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OutlineSection"

  /outlines/{id}/reorder:
    post:
      operationId: reorderOutlineSections
      tags: [outlines]
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SectionOrder"
      responses:
        "200":
          description: Reordered outline
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Outline"

  # ─── Documents ────────────────────────────────────────────────────────────────
  /projects/{id}/document:
    get:
      operationId: getDocument
      tags: [documents]
      summary: Get the document for a project
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Document with sections
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Document"
        "404":
          description: Not found
    post:
      operationId: initDocument
      tags: [documents]
      summary: Initialize a document from an approved outline
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "201":
          description: Document initialized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Document"

  /document-sections/{id}:
    get:
      operationId: getDocumentSection
      tags: [documents]
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Document section
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DocumentSection"
    patch:
      operationId: updateDocumentSection
      tags: [documents]
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DocumentSectionUpdate"
      responses:
        "200":
          description: Updated section
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DocumentSection"

  /document-sections/{id}/draft:
    post:
      operationId: draftDocumentSection
      tags: [documents]
      summary: Draft a document section using AI
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Drafted section
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DocumentSection"

  /document-sections/{id}/edit:
    post:
      operationId: editDocumentSection
      tags: [documents]
      summary: AI edit a section (natural tone, developmental, continuity, proofread)
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SectionEditRequest"
      responses:
        "200":
          description: Edited section
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DocumentSection"

  /document-sections/{id}/lock:
    post:
      operationId: lockDocumentSection
      tags: [documents]
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Locked section
          content:
